[global]
workgroup = WORKGROUP
server string = Samba Server %v
netbios name = payloads
security = user
map to guest = bad user
name resolve order = bcast host
dns proxy = no
bind interfaces only = yes

[payloads]
path = /samba/payloads
writable = yes
guest ok = yes
guest only = yes
read only = no
directory mode = 0777
force user = nobody