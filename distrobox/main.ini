[main]
image=archlinux:latest
home=$HOME/containers/main
pull=false
replace=false
start_now=true

init=false
nvidia=false

additional_packages=git base-devel devtools
additional_packages=fzf bat eza httpie zoxide fd ripgrep atool
additional_packages=ranger ueberzugpp starship zellij
additional_packages=imagemagick streamlink mpv
additional_packages=fish fisher
additional_packages=emacs

# --- QEMU / virtualization stack (OPTIONAL — commented out) -----------------
# Kept for cross-machine portability. Enable ONLY on hosts where KVM / nested
# virtualization is available.
#   * DO NOT enable on the locked-down Windows 11 / WSL2 host:
#     `wsl2.nestedVirtualization` is disabled by computer policy, so KVM and
#     virt-manager cannot function there.
#   * On bare-metal Linux (or a host with nested virt allowed), uncomment the
#     line below to install the stack.
# additional_packages=qemu virt-manager dnsmasq iptables ebtables swtpm edk2-ovmf

#init_hooks=ln -sf /usr/bin/distrobox-host-exec /usr/local/bin/podman
